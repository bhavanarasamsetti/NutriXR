<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriXR AR Slice</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js",
          "three/examples/jsm/webxr/ARButton.js": "https://cdn.jsdelivr.net/npm/three@0.158/examples/jsm/webxr/ARButton.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.158/examples/jsm/loaders/GLTFLoader.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.158/examples/jsm/controls/OrbitControls.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 30% 20%, #0f172a, #0b1220 40%, #070c17 80%);
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
      }
      body.ar-active header,
      body.ar-active .prompt-card,
      body.ar-active #ar-button {
        display: none;
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .back {
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
      }
      main {
        flex: 1;
        padding: 18px 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .stage {
        flex: 1;
        min-height: 50vh;
        position: relative;
      }
      .prompt-card {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(99, 102, 241, 0.25);
        border-radius: 18px;
        padding: 18px 18px 20px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.35);
        display: grid;
        gap: 10px;
      }
      .prompt-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .prompt-sub {
        color: #cbd5f5;
        font-size: 14px;
        line-height: 1.45;
      }
      #ar-button {
        display: flex;
        justify-content: center;
      }
      #ar-button button {
        font-size: 16px;
        padding: 12px 20px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(120deg, #38bdf8, #6366f1);
        color: #0b1220;
        font-weight: 700;
        cursor: pointer;
      }
      #exit-ar {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 8px 12px;
        border-radius: 999px;
        border: none;
        background: rgba(15, 23, 42, 0.9);
        color: #e5e7eb;
        font-weight: 700;
        cursor: pointer;
        z-index: 30;
        display: none;
      }
      body.ar-active #exit-ar {
        display: inline-flex;
      }
      #fruit-name,
      #model-path {
        display: none !important;
      }

      .slice-overlay {
        position: fixed;
        right: 12px;
        top: 70px;
        bottom: 16px;
        width: 280px;
        z-index: 25;
        display: none;
        gap: 12px;
        grid-auto-rows: min-content;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      body.ar-active .slice-overlay {
        display: grid;
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }
      .slice-card {
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        padding: 12px;
        backdrop-filter: blur(10px);
      }
      .slice-card h3 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 800;
      }
      .slice-meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #cbd5f5;
        margin-bottom: 8px;
      }
      .slice-slider {
        width: 100%;
      }
      .slice-list {
        display: grid;
        gap: 6px;
        max-height: 240px;
        overflow: auto;
      }
      .slice-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .slice-note {
        font-size: 11px;
        color: #cbd5f5;
        margin-top: 8px;
      }
      .slice-controls-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .slice-control-btn {
        flex: 1;
        padding: 8px 10px;
        border-radius: 12px;
        border: none;
        background: rgba(148, 163, 184, 0.2);
        color: #e2e8f0;
        font-weight: 700;
        cursor: pointer;
      }
      .slice-control-btn.primary {
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        color: #fff;
      }

      @media (max-width: 720px) {
        .slice-overlay {
          left: 12px;
          right: 12px;
          top: auto;
          bottom: 16px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="/slice">Back</a>
    </header>
    <main>
      <div class="prompt-card">
        <div class="prompt-title">Ready for AR Slice?</div>
        <div class="prompt-sub">
          We will open your camera so you can place the sliced fruit in your space. Allow camera access to continue.
        </div>
      </div>
      <div id="ar-button"></div>
      <div><span id="fruit-name"></span></div>
      <div><span id="model-path"></span></div>
      <div class="stage" id="stage"></div>
    </main>

    <section class="slice-overlay" aria-live="polite">
      <div class="slice-card">
        <h3>Slice Controls</h3>
        <div class="slice-meta">
          <span id="slice-fruit">Fruit</span>
          <span id="slice-percent">0%</span>
        </div>
        <input id="slice-range" class="slice-slider" type="range" min="0" max="100" value="0" />
        <div class="slice-note">Nutrient values are scaled to the selected portion.</div>
        <div class="slice-controls-row">
          <button id="slice-move" class="slice-control-btn primary" type="button">Move</button>
          <button id="slice-reset-scale" class="slice-control-btn" type="button">Reset Zoom</button>
        </div>
      </div>
      <div class="slice-card">
        <h3>Nutrition (portion)</h3>
        <div class="slice-list" id="slice-list"></div>
      </div>
    </section>

    <button id="exit-ar" type="button">Stop AR</button>

    <script type="module">
      import * as THREE from "three";
      import { ARButton } from "three/examples/jsm/webxr/ARButton.js";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

      const statusEl = document.getElementById("status");
      const noteEl = document.getElementById("note");
      const fruitNameEl = document.getElementById("fruit-name");
      const modelPathEl = document.getElementById("model-path");
      const stageEl = document.getElementById("stage");
      const arButtonSlot = document.getElementById("ar-button");
      const exitButton = document.getElementById("exit-ar");
      const sliceListEl = document.getElementById("slice-list");
      const sliceRangeEl = document.getElementById("slice-range");
      const slicePctEl = document.getElementById("slice-percent");
      const sliceFruitEl = document.getElementById("slice-fruit");
      const sliceMoveEl = document.getElementById("slice-move");
      const sliceResetScaleEl = document.getElementById("slice-reset-scale");

      const setStatus = (text) => {
        if (statusEl) statusEl.textContent = text;
      };
      const setNote = (text) => {
        if (noteEl) noteEl.textContent = text || "";
      };

      const basePath = new URL(".", window.location.href).pathname.replace(/\/$/, "");

      function getModelPath() {
        const params = new URLSearchParams(window.location.search);
        const m = params.get("model");
        if (m && m.toLowerCase().endsWith(".glb")) {
          const sanitized = m.replace(/^\//, "");
          if (sanitized.startsWith("models/")) return `${basePath}/${sanitized}`;
          return `${basePath}/models/${sanitized}`;
        }
        return `${basePath}/models/Apple.glb`;
      }

      function getPayload() {
        try {
          let raw = sessionStorage.getItem("nutrixr-ar-payload");
          if (!raw) {
            raw = localStorage.getItem("nutrixr-ar-payload");
            if (raw) {
              try {
                sessionStorage.setItem("nutrixr-ar-payload", raw);
              } catch (err) {
                console.warn("Failed to sync AR payload to sessionStorage", err);
              }
            }
          }
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (err) {
          console.warn("Failed to parse AR payload", err);
          return null;
        }
      }

      function renderNutrition(list) {
        if (!sliceListEl) return;
        sliceListEl.innerHTML = "";
        if (!list.length) {
          sliceListEl.innerHTML = '<div class="slice-item">No nutrition data.</div>';
          return;
        }
        list.slice(0, 10).forEach((item) => {
          const row = document.createElement("div");
          row.className = "slice-item";
          const name = document.createElement("span");
          const value = document.createElement("span");
          name.textContent = item.name || "Nutrient";
          const amount =
            typeof item.amount === "number" ? item.amount.toFixed(2) : item.amount || "--";
          value.textContent = `${amount} ${item.unit || ""}`.trim();
          row.appendChild(name);
          row.appendChild(value);
          sliceListEl.appendChild(row);
        });
      }

      const payload = getPayload();
      const nutrients = Array.isArray(payload?.nutrients) ? payload.nutrients : [];
      const fruitMeta = payload?.fruit || null;
      const slicePct =
        typeof payload?.slicePercentage === "number" ? Math.round(payload.slicePercentage) : 0;
      const modelPath = getModelPath();
      const modelURL = modelPath.startsWith("http") ? modelPath : `${window.location.origin}${modelPath}`;
      fruitNameEl.textContent = fruitMeta?.name || "Fruit";
      modelPathEl.textContent = modelPath;
      sliceRangeEl.value = slicePct;
      slicePctEl.textContent = `${slicePct}%`;
      sliceFruitEl.textContent = fruitMeta?.name || "Fruit";
      const baseNutrients = nutrients.map((item) => {
        const fallbackBase =
          typeof item.amount === "number" && slicePct
            ? (item.amount * 100) / slicePct
            : item.amount;
        return {
          ...item,
          baseAmount: typeof item.originalAmount === "number" ? item.originalAmount : fallbackBase
        };
      });

      const applySlice = (pctValue) => {
        const pct = Number.isFinite(pctValue) ? pctValue : 0;
        sliceRangeEl.value = pct;
        slicePctEl.textContent = `${pct}%`;
        const scaled = baseNutrients.map((item) => ({
          ...item,
          amount: typeof item.baseAmount === "number" ? (item.baseAmount * pct) / 100 : item.amount
        }));
        renderNutrition(scaled);
        try {
          const next = {
            ...(payload || {}),
            slicePercentage: pct,
            nutrients: scaled
          };
          sessionStorage.setItem("nutrixr-ar-payload", JSON.stringify(next));
        } catch (err) {
          console.warn("Failed to update AR slice payload", err);
        }
      };

      applySlice(slicePct);

      sliceRangeEl.addEventListener("input", (event) => {
        const next = Number(event.target.value);
        applySlice(next);
      });

      const ua = navigator.userAgent || "";
      const isMobile = /Android|iPhone|iPad|iPod/i.test(ua);
      const shouldShowPreview = () => false;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
      renderer.xr.enabled = true;
      renderer.domElement.style.touchAction = "none";
      renderer.domElement.classList.add("xr-canvas");
      stageEl.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, stageEl.clientWidth / stageEl.clientHeight, 0.01, 20);
      camera.position.set(0, 1.4, 3.5);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1, 0);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xffffff, 0x4b5563, 0.9));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
      dirLight.position.set(2, 4, 1.5);
      scene.add(dirLight);

      const reticleGeo = new THREE.RingGeometry(0.08, 0.12, 32);
      reticleGeo.rotateX(-Math.PI / 2);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const floaters = [];
      const clock = new THREE.Clock();

      let contentGroup = null;
      let placed = false;
      let moveMode = false;
      let hitTestSource = null;
      let hitTestSourceRequested = false;
      let referenceSpace = null;
      const activePointers = new Map();
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;
      let pinchBaseDistance = null;
      let pinchStartScale = 1;

      const controller = renderer.xr.getController(0);
      controller.addEventListener("select", () => {
        if (!contentGroup) return;
        if (!renderer.xr.isPresenting) return;

        if (!placed) {
          placeContent();
          return;
        }
        if (moveMode) {
          moveContentToReticle();
        }
      });
      scene.add(controller);

      const raycaster = new THREE.Raycaster();

      const loader = new GLTFLoader();
      let fruitRoot = null;

      function clearScene() {
        if (fruitRoot) {
          scene.remove(fruitRoot);
          fruitRoot.traverse((child) => {
            if (child.isMesh) {
              child.geometry?.dispose?.();
              if (child.material?.map) child.material.map.dispose();
              child.material?.dispose?.();
            }
          });
          fruitRoot = null;
        }
        floaters.length = 0;
      }

      function loadFruit() {
        clearScene();
        loader.load(
          modelURL,
          (gltf) => {
            fruitRoot = gltf.scene;
            fruitRoot.traverse((child) => {
              if (child.isMesh) child.castShadow = true;
            });

            contentGroup = new THREE.Group();
            contentGroup.add(fruitRoot);

            contentGroup.position.set(0, 0, -1);
            contentGroup.scale.setScalar(0.55);
            scene.add(contentGroup);
          },
          undefined,
          (err) => {
            console.error("Failed to load model", err);
          }
        );
      }

      loadFruit();

      const placeContent = () => {
        if (!contentGroup) return;
        if (reticle.visible) {
          contentGroup.position.setFromMatrixPosition(reticle.matrix);
        } else {
          contentGroup.position.set(0, 0, -1);
        }
        placed = true;
        moveMode = false;
        reticle.visible = false;
        if (sliceMoveEl) sliceMoveEl.textContent = "Move";
      };

      const moveContentToReticle = () => {
        if (!contentGroup || !reticle.visible) return;
        contentGroup.position.setFromMatrixPosition(reticle.matrix);
        moveMode = false;
        reticle.visible = false;
        if (sliceMoveEl) sliceMoveEl.textContent = "Move";
      };

      function onResize() {
        const width = stageEl.clientWidth;
        const height = stageEl.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }
      window.addEventListener("resize", onResize);

      function updateReticle(frame) {
        if (!renderer.xr.isPresenting) return;
        if (!hitTestSourceRequested) {
          renderer.xr.getSession().requestReferenceSpace("viewer").then((refSpace) => {
            renderer.xr.getSession().requestHitTestSource({ space: refSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          renderer.xr.getSession().addEventListener("end", () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }
        if (!hitTestSource) return;
        if (!referenceSpace) referenceSpace = renderer.xr.getReferenceSpace();
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length && (!placed || moveMode)) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }

      function animate(time, frame) {
        if (frame) updateReticle(frame);
        const delta = clock.getDelta();
        controls.update();
        renderer.render(scene, camera);
      }

      renderer.setAnimationLoop(animate);

      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ["hit-test"],
        optionalFeatures: ["dom-overlay"],
        domOverlay: { root: document.body }
      });
      arButtonSlot.appendChild(arButton);

      exitButton.addEventListener("click", () => {
        const session = renderer.xr.getSession();
        if (session) session.end();
      });

      renderer.xr.addEventListener("sessionstart", () => {
        document.body.classList.add("ar-active");
        if (sliceMoveEl) sliceMoveEl.textContent = "Move";
      });
      renderer.xr.addEventListener("sessionend", () => {
        document.body.classList.remove("ar-active");
        placed = false;
        moveMode = false;
      });

      renderer.domElement.addEventListener("pointerdown", (event) => {
        if (!renderer.xr.isPresenting) return;
        if (!placed) {
          placeContent();
        } else if (moveMode) {
          moveContentToReticle();
        }
        activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (activePointers.size === 1) {
          isDragging = true;
          lastX = event.clientX;
          lastY = event.clientY;
        } else if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          pinchBaseDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          pinchStartScale = contentGroup?.scale?.x || 1;
        }
      });
      renderer.domElement.addEventListener("pointerup", (event) => {
        activePointers.delete(event.pointerId);
        isDragging = false;
        pinchBaseDistance = null;
      });
      renderer.domElement.addEventListener("pointercancel", (event) => {
        activePointers.delete(event.pointerId);
        isDragging = false;
        pinchBaseDistance = null;
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!renderer.xr.isPresenting || !placed || !contentGroup) return;
        if (activePointers.has(event.pointerId)) {
          activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        }
        if (activePointers.size === 1 && isDragging) {
          const dx = event.clientX - lastX;
          const dy = event.clientY - lastY;
          lastX = event.clientX;
          lastY = event.clientY;
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
          right.y = 0;
          forward.y = 0;
          right.normalize();
          forward.normalize();
          const moveScale = 0.0025;
          contentGroup.position.addScaledVector(right, dx * moveScale);
          contentGroup.position.addScaledVector(forward, dy * moveScale);
        } else if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (pinchBaseDistance && dist > 0) {
            const factor = dist / pinchBaseDistance;
            const nextScale = THREE.MathUtils.clamp(pinchStartScale * factor, 0.3, 2.5);
            contentGroup.scale.setScalar(nextScale);
          }
        }
      });

      sliceMoveEl?.addEventListener("click", () => {
        if (!placed) return;
        moveMode = !moveMode;
        sliceMoveEl.textContent = moveMode ? "Tap to place" : "Move";
      });
      sliceResetScaleEl?.addEventListener("click", () => {
        if (!contentGroup) return;
        contentGroup.scale.setScalar(0.55);
      });

    </script>
  </body>
</html>
